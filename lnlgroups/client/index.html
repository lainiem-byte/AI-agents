    <!-- 3. LNL Radar: Custom Outreach Tracking (?ref= param → n8n webhook) -->
    <script>
      window.addEventListener('DOMContentLoaded', (event) => {
        const urlParams = new URLSearchParams(window.location.search);
        const leadRef = urlParams.get('ref');
        if (leadRef) {
          console.log('LNL Radar: Initializing ping for ' + leadRef);
          fetch('https://n8n.srv1244684.hstgr.cloud/webhook/lnl-radar-ping', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'RADAR_PING',
              lead_identity: leadRef,
              page_path: window.location.pathname,
              timestamp: new Date().toISOString()
            })
          }).catch(err => console.error('Radar Logic Leak:', err));
        }
      });
    </script>
